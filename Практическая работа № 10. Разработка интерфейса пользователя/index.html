<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.png">
    <title>Главная — Конференции.РФ</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page">
    <!-- Шапка сайта -->
    <header class="header">
        <div class="container header__inner">
            <a class="header__logo" href="/">
                <img class="header__logo-img" src="/static/img/logo.png" alt="Логотип">
                <span>Конференции.РФ</span>
            </a>
            <nav class="nav" id="nav"></nav>
        </div>
    </header>
    <!-- Основное содержимое -->
    <main class="main container">
        <div id="messages"></div>
        <section class="hero">
            <h1 class="hero__title">Помещения для всероссийских конференций</h1>
            <p class="hero__text">Аудитории, коворкинги и кинозалы для мероприятий любого масштаба.</p>
            <!-- Слайдер Bootstrap с автопрокруткой -->
            <div id="roomsSlider" class="carousel slide slider" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="slider__img d-block w-100" src="/static/img/slide-1.webp" alt="Аудитория">
                        <div class="carousel-caption slider__caption"><h2>Аудитории</h2></div>
                    </div>
                    <div class="carousel-item">
                        <img class="slider__img d-block w-100" src="/static/img/slide-2.webp" alt="Коворкинг">
                        <div class="carousel-caption slider__caption"><h2>Коворкинги</h2></div>
                    </div>
                    <div class="carousel-item">
                        <img class="slider__img d-block w-100" src="/static/img/slide-3.webp" alt="Кинозал">
                        <div class="carousel-caption slider__caption"><h2>Кинозалы</h2></div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#roomsSlider" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#roomsSlider" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>
            <a class="btn btn-primary button" href="/booking/new">Забронировать помещение</a>
        </section>
        <section class="rooms">
            <h2 class="section-title">Наши помещения</h2>
            <div class="row g-3" id="roomList"></div>
        </section>
    </main>
    <!-- Подвал -->
    <footer class="footer">
        <div class="container"><p class="footer__text">© 2027 Конференции.РФ</p></div>
    </footer>
    <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
